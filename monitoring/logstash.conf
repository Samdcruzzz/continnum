# Logstash Configuration for Gericure (Phase 3)
# Processes logs from Gericure application and passes to Elasticsearch

input {
  # Read from Docker logs
  tcp {
    port => 5000
    codec => json
    type => "docker"
  }
  
  # Read from syslog
  udp {
    port => 5140
    type => "syslog"
  }
  
  # Read from file (application logs)
  file {
    path => "/var/log/gericure/*.log"
    start_position => "beginning"
    type => "application"
  }
}

filter {
  # Parse JSON logs
  if [type] == "docker" {
    json {
      source => "message"
      skip_on_invalid_json => true
    }
  }
  
  # Parse syslog
  if [type] == "syslog" {
    grok {
      match => { "message" => "%{SYSLOGLINE}" }
    }
  }
  
  # Add metadata
  mutate {
    add_field => {
      "[@metadata][index_name]" => "gericure-%{+YYYY.MM.dd}"
      "environment" => "production"
      "application" => "gericure"
    }
    
    # Remove unwanted fields
    remove_field => ["@version"]
  }
  
  # Add GeoIP information (optional)
  if [clientip] {
    geoip {
      source => "clientip"
      target => "geoip"
    }
  }
  
  # Date parsing
  date {
    match => [ "timestamp", "ISO8601", "yyyy-MM-dd HH:mm:ss" ]
    target => "@timestamp"
  }
  
  # Parse API requests
  if [type] == "application" and [message] =~ /^GET|POST|PUT|DELETE/ {
    grok {
      match => {
        "message" => "%{WORD:method} %{NOTSPACE:path} %{NOTSPACE:http_version} %{NUMBER:status_code} %{NUMBER:response_time}"
      }
    }
    
    # Convert numeric fields
    mutate {
      convert => {
        "status_code" => "integer"
        "response_time" => "float"
      }
    }
  }
  
  # Alert parsing
  if [message] =~ /Alert/ {
    grok {
      match => {
        "message" => "Alert: %{WORD:alert_type} - %{DATA:description} \(Severity: %{WORD:severity}\)"
      }
    }
  }
  
  # HIPAA audit log parsing
  if [type] == "application" and [message] =~ /Audit/ {
    mutate {
      add_tag => ["audit_log", "hipaa_tracked"]
    }
  }
}

output {
  # Send to Elasticsearch
  elasticsearch {
    hosts => ["elasticsearch:9200"]
    index => "%{[@metadata][index_name]}"
    document_type => "_doc"
  }
  
  # Also output to stdout for debugging
  stdout {
    codec => rubydebug
  }
  
  # Send alerts to file
  if "alert" in [tags] {
    file {
      path => "/var/log/gericure/alerts.log"
      codec => json
    }
  }
  
  # Send HIPAA audit logs to separate index
  if "audit_log" in [tags] {
    elasticsearch {
      hosts => ["elasticsearch:9200"]
      index => "gericure-audit-%{+YYYY.MM.dd}"
      document_type => "_doc"
    }
  }
}
